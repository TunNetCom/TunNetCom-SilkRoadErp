# ============================================================
# Reusable BUILD stage template
# ------------------------------------------------------------
# Job 1 "BuildSolution" (runs once):
#   Docker login -> SDKs -> Restore -> OWASP Dependency-Check
#   (SCA) -> SonarQube Prepare -> Build -> Tests -> Analyze ->
#   Pre-Docker Disk Cleanup
#
# Job 2 "BuildImages" (strategy.matrix: one leg per entry in the
#   `images` parameter, run in parallel on separate agents):
#   Docker login -> Trivy install -> Build image -> Trivy scan
#   (HTML + JSON) -> publish reports -> DefectDojo -> Push ->
#   Cleanup
#
# Include it from any pipeline:
#
#   stages:
#   - template: templates/build.yml
#     parameters:
#       dockerRegistryServiceConnection: '<dockerhub service connection>'
#       dockerRepository: 'myorg/myapp'
#       images:
#       - name: api            # one entry per image to build/scan/push
#         label: API
#         dockerfilePath: 'src/Api/Dockerfile'
#         imageTag: 'api-$(Build.BuildId)'
#         ddEngagementName: 'MyApp API'
#         ddTestTitle: 'Trivy - API Image'
#       - name: web
#         label: Web
#         dockerfilePath: 'src/WebApp/Dockerfile'
#         imageTag: 'webapp-$(Build.BuildId)'
#         ddEngagementName: 'MyApp Web'
#         ddTestTitle: 'Trivy - Web Image'
#       sonarProjectKey: '<sonar project key>'
#       sonarProjectName: '<sonar project name>'
#       sonarHostUrl: 'https://sonarqube.example.com'
#       nvdApiKey: $(nvdApiKey)
#       defectDojoUrl: $(defectDojoUrl)
#       defectDojoApiKey: $(defectDojoApiKey)
#
# Feature toggles: enableOwasp, enableSonarQube, enableTests,
# enableTrivy, enableDockerPush (all default true).
# NuGet: restores via the repo nuget.config (feedsToUse=config) +
# NuGetAuthenticate for Azure Artifacts feeds; nugetConfigPath,
# enableNuGetAuthenticate, nugetServiceConnection params. The Docker
# image builds pass FEED_ACCESSTOKEN/URL/USERNAME build-args so the
# private feed resolves inside the containers (Dockerfiles install the
# Azure Artifacts credential provider). Override nugetFeedUrl per
# consuming project when it uses a different Azure Artifacts feed.
# ============================================================
parameters:
- name: stageName
  type: string
  default: 'Build'
- name: stageDisplayName
  type: string
  default: 'Build, SonarQube, Scan & Push'
- name: poolImage
  type: string
  default: 'ubuntu-latest'
- name: timeoutInMinutes
  type: number
  default: 300
- name: buildConfiguration
  type: string
  default: 'Release'
- name: solution
  type: string
  default: '**/*.sln'
- name: testProjects
  type: string
  default: '**/*[Tt]est*/*.csproj'
- name: testRunSettingsPath
  type: string
  default: 'test.runsettings'
- name: dotnetSdkVersions
  type: object
  default:
  - '8.x'
  - '10.x'

# NuGet
- name: nugetConfigPath
  type: string
  default: 'nuget.config'
- name: enableNuGetAuthenticate
  type: boolean
  default: true
- name: nugetServiceConnection
  type: string
  default: ''
- name: nugetFeedUrl
  type: string
  default: 'https://pkgs.dev.azure.com/TunNetCom/Silk_Road_ERP/_packaging/SilkRoadFeed/nuget/v3/index.json'
- name: nugetFeedUsername
  type: string
  default: 'docker'

# Docker / images
- name: dockerRegistryServiceConnection
  type: string
- name: dockerRepository
  type: string
# Data-driven image list. One entry per image to build/scan/push.
# Each entry: { name, label, dockerfilePath, imageTag, ddEngagementName, ddTestTitle }
#   - backend-only: 1 entry
#   - .NET + Angular: 2 entries (backend + frontend)
- name: images
  type: object
  default: []
- name: dockerBuildContext
  type: string
  default: '.'

# SonarQube
- name: sonarConnection
  type: string
  default: 'SonarConnection'
- name: sonarProjectKey
  type: string
  default: ''
- name: sonarProjectName
  type: string
  default: ''
- name: sonarHostUrl
  type: string
  default: ''
- name: sonarExclusions
  type: string
  default: '**/bin/**,**/obj/**,**/*.json,**/*.html'
- name: sonarOpenCoverReportsPath
  type: string
  default: '$(Agent.TempDirectory)/**/coverage.opencover.xml'
- name: sonarVstestReportsPath
  type: string
  default: '$(Agent.TempDirectory)/**/*.trx'
- name: sonarCpdExclusions
  type: string
  default: '**/*.json,**/*.html'

# Security
- name: nvdApiKey
  type: string
  default: ''
- name: nvdCacheKey
  type: string
  default: 'dependency-check-nvd-v2'
- name: trivySeverity
  type: string
  default: 'HIGH,CRITICAL'
- name: owaspFailOnCvss
  type: string
  default: '11'
- name: mssqlImage
  type: string
  default: 'mcr.microsoft.com/mssql/server:2022-latest'

# DefectDojo
- name: defectDojoUrl
  type: string
  default: ''
- name: defectDojoApiKey
  type: string
  default: ''
- name: defectDojoMinSeverity
  type: string
  default: 'High'
- name: productName
  type: string
  default: 'SilkRoad ERP'
- name: productTypeName
  type: string
  default: 'SilkRoad ERP'
- name: dependencyEngagementName
  type: string
  default: 'SilkRoad Dependencies'

# Feature toggles
- name: enableOwasp
  type: boolean
  default: true
- name: enableSonarQube
  type: boolean
  default: true
- name: enableTests
  type: boolean
  default: true
- name: enableTrivy
  type: boolean
  default: true
- name: enableDockerPush
  type: boolean
  default: true

stages:
- stage: ${{ parameters.stageName }}
  displayName: ${{ parameters.stageDisplayName }}
  pool:
    vmImage: ${{ parameters.poolImage }}
  jobs:
  - job: BuildSolution
    displayName: Restore, Analyze, Build & Test
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    cancelTimeoutInMinutes: 5
    steps:

    - task: Docker@2
      displayName: Docker Login
      inputs:
        command: login
        containerRegistry: ${{ parameters.dockerRegistryServiceConnection }}

    - ${{ each sdk in parameters.dotnetSdkVersions }}:
      - task: UseDotNet@2
        displayName: Install .NET SDK ${{ sdk }}
        inputs:
          packageType: sdk
          version: ${{ sdk }}

    - ${{ if eq(parameters.enableNuGetAuthenticate, true) }}:
      - task: NuGetAuthenticate@1
        displayName: Authenticate NuGet feeds
        ${{ if not(eq(parameters.nugetServiceConnection, '')) }}:
          inputs:
            nuGetServiceConnections: ${{ parameters.nugetServiceConnection }}

    - task: DotNetCoreCLI@2
      displayName: Restore NuGet packages
      inputs:
        command: restore
        projects: ${{ parameters.solution }}
        feedsToUse: 'config'
        nugetConfigPath: ${{ parameters.nugetConfigPath }}

    # ============================================================
    # 🛡️ OWASP DEPENDENCY-CHECK (SCA - scans NuGet dependencies
    # against the NVD database, independent of Trivy's image scan)
    # ============================================================
    - ${{ if eq(parameters.enableOwasp, true) }}:
      - task: CmdLine@2
        displayName: Prepare OWASP Dependency-Check directories
        inputs:
          script: |
            mkdir -p $(System.DefaultWorkingDirectory)/dependency-check-report
            mkdir -p $(Pipeline.Workspace)/dependency-check-data
            mkdir -p /tmp/dependency-check-data
            chmod 777 $(System.DefaultWorkingDirectory)/dependency-check-report
            chmod 777 $(Pipeline.Workspace)/dependency-check-data
            chmod 777 /tmp/dependency-check-data

      # ---- Move cached NVD data to /tmp AFTER Cache@2 has restored it.
      # Was previously inside "Prepare" above, but that ran before Cache@2
      # restored the data, so /tmp was always empty → full re-download every run.
      - task: CmdLine@2
        displayName: Copy cached NVD data to local /tmp
        inputs:
          script: |
            if [ -n "$(ls -A $(Pipeline.Workspace)/dependency-check-data 2>/dev/null)" ]; then
              cp -a $(Pipeline.Workspace)/dependency-check-data/. /tmp/dependency-check-data/
              echo "Copied cached NVD data to /tmp."
            else
              echo "No cached NVD data found — will download fresh."
            fi

      # Persist the NVD vulnerability database across pipeline runs so most
      # builds only need an incremental update instead of a full cold pull.
      # ---- FIX v2: BuildId-keyed cache (always a "miss") so a clean DB gets
      # saved fresh at the end of every successful run. restoreKeys still lets
      # us pull the most recent good copy to keep updates incremental.
      - task: Cache@2
        displayName: Cache OWASP Dependency-Check NVD data
        inputs:
          key: '${{ parameters.nvdCacheKey }} | "$(Build.BuildId)"'
          restoreKeys: |
            ${{ parameters.nvdCacheKey }}
          path: $(Pipeline.Workspace)/dependency-check-data

      - task: CmdLine@2
        displayName: Clear stale Dependency-Check lock files
        inputs:
          script: |
            find /tmp/dependency-check-data -name "*.lock.db" -delete 2>/dev/null || true

      - task: CmdLine@2
        displayName: Update NVD database
        continueOnError: true
        condition: succeededOrFailed()
        timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
        inputs:
          script: |
            DATA_DIR=/tmp/dependency-check-data
            LOG_FILE="$DATA_DIR/odc-update.log"

            update_nvd() {
              docker run --rm \
                -v "$DATA_DIR":/usr/share/dependency-check/data:rw \
                owasp/dependency-check:latest \
                --updateonly \
                --nvdApiKey "$NVD_API_KEY" \
                --nvdValidForHours 24 \
                --nvdApiDelay 4000 \
                --log /usr/share/dependency-check/data/odc-update.log
            }

            echo "Attempting NVD update..."
            if update_nvd; then
              echo "NVD update succeeded."
            else
              echo "##[warning]NVD update failed. Dumping verbose log to find the real cause (the lock error is often a misleading downstream symptom, not the actual root cause):"
              echo "---------------------------------------------------------------"
              cat "$LOG_FILE" 2>/dev/null || echo "(no log file found)"
              echo "---------------------------------------------------------------"
              echo "##[warning]Purging local NVD data and retrying with a clean rebuild..."
              sudo find "$DATA_DIR" -mindepth 1 -delete
              if update_nvd; then
                echo "NVD update succeeded after clean rebuild."
              else
                echo "##[error]NVD update failed on both attempts. Verbose log from retry:"
                echo "---------------------------------------------------------------"
                cat "$LOG_FILE" 2>/dev/null || echo "(no log file found)"
                echo "---------------------------------------------------------------"
                exit 1
              fi
            fi
        env:
          NVD_API_KEY: ${{ parameters.nvdApiKey }}

      # ---- Warn (don't fail the build) if the NVD DB looks suspiciously small,
      # which would mean the update above failed/skipped and results may be stale.
      - task: CmdLine@2
        displayName: Sanity-check NVD DB size
        condition: succeededOrFailed()
        inputs:
          script: |
            DB_FILE=$(find /tmp/dependency-check-data -name "odc.mv.db" 2>/dev/null | head -n1)
            if [ -z "$DB_FILE" ]; then
              echo "##vso[task.logissue type=warning]NVD database file not found — scan will likely run against an empty DB."
            else
              SIZE_MB=$(du -m "$DB_FILE" | cut -f1)
              echo "NVD DB size: ${SIZE_MB} MB"
              if [ "$SIZE_MB" -lt 50 ]; then
                echo "##vso[task.logissue type=warning]NVD database is only ${SIZE_MB}MB — looks stale/incomplete. Scan results may under-report vulnerabilities."
              fi
            fi

      - task: CmdLine@2
        displayName: Sync updated NVD data back for caching
        condition: succeededOrFailed()
        inputs:
          script: |
            rm -rf $(Pipeline.Workspace)/dependency-check-data/*
            cp -a /tmp/dependency-check-data/. $(Pipeline.Workspace)/dependency-check-data/

      - task: CmdLine@2
        displayName: Run OWASP Dependency-Check
        condition: succeededOrFailed()
        inputs:
          script: |
            docker run --rm \
              -v $(System.DefaultWorkingDirectory):/src:ro \
              -v $(System.DefaultWorkingDirectory)/dependency-check-report:/report:rw \
              -v /tmp/dependency-check-data:/usr/share/dependency-check/data:rw \
              owasp/dependency-check:latest \
              --scan /src \
              --project "${{ parameters.productName }}" \
              --format HTML \
              --format JSON \
              --format XML \
              --out /report \
              --noupdate \
              --failOnCVSS ${{ parameters.owaspFailOnCvss }}

      # ---- FIX: container runs as root, so files land as root-owned with
      # restrictive perms. Reclaim ownership before publish/upload steps read them.
      - task: CmdLine@2
        displayName: Fix OWASP Dependency-Check report permissions
        condition: succeededOrFailed()
        inputs:
          script: |
            sudo chown -R $(id -u):$(id -g) $(System.DefaultWorkingDirectory)/dependency-check-report
            sudo chmod -R 755 $(System.DefaultWorkingDirectory)/dependency-check-report

      - task: PublishPipelineArtifact@1
        displayName: Publish OWASP Dependency-Check Report
        condition: succeededOrFailed()
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)/dependency-check-report'
          artifactName: 'OWASP-DependencyCheck-Report'

      - task: PublishHtmlReport@1
        displayName: Show OWASP Dependency-Check Tab
        condition: succeededOrFailed()
        inputs:
          reportDir: '$(System.DefaultWorkingDirectory)/dependency-check-report'
          tabName: 'OWASP Dependency-Check'

      - task: CmdLine@2
        displayName: Push OWASP Dependency-Check results to DefectDojo
        condition: succeededOrFailed()
        inputs:
          script: |
            HTTP_CODE=$(curl -sS -o /tmp/dd_owasp_response.json -w "%{http_code}" -X POST "$DEFECTDOJO_URL/api/v2/reimport-scan/" \
              -H "Authorization: Token $DEFECTDOJO_API_KEY" \
              -F "scan_type=Dependency Check Scan" \
              -F "file=@$(System.DefaultWorkingDirectory)/dependency-check-report/dependency-check-report.xml" \
              -F "product_type_name=${{ parameters.productTypeName }}" \
              -F "product_name=${{ parameters.productName }}" \
              -F "engagement_name=${{ parameters.dependencyEngagementName }}" \
              -F "test_title=OWASP Dependency-Check" \
              -F "auto_create_context=True" \
              -F "close_old_findings=true" \
              -F "minimum_severity=${{ parameters.defectDojoMinSeverity }}")
            echo "DefectDojo response (HTTP $HTTP_CODE):"
            cat /tmp/dd_owasp_response.json
            echo ""
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "##vso[task.logissue type=error]DefectDojo import (OWASP Dependency-Check) failed with HTTP $HTTP_CODE"
              exit 1
            fi
        env:
          DEFECTDOJO_URL: ${{ parameters.defectDojoUrl }}
          DEFECTDOJO_API_KEY: ${{ parameters.defectDojoApiKey }}

    - ${{ if eq(parameters.enableSonarQube, true) }}:
      - task: SonarQubePrepare@8
        displayName: SonarQube Prepare
        inputs:
          SonarQube: ${{ parameters.sonarConnection }}
          scannerMode: 'dotnet'
          projectKey: ${{ parameters.sonarProjectKey }}
          projectName: ${{ parameters.sonarProjectName }}
          extraProperties: |
            sonar.host.url=${{ parameters.sonarHostUrl }}
            sonar.exclusions=${{ parameters.sonarExclusions }}
            sonar.cs.opencover.reportsPaths=${{ parameters.sonarOpenCoverReportsPath }}
            sonar.cs.vstest.reportsPaths=${{ parameters.sonarVstestReportsPath }}
            sonar.cpd.exclusions=${{ parameters.sonarCpdExclusions }}

    - task: DotNetCoreCLI@2
      displayName: Build solution
      inputs:
        command: build
        projects: ${{ parameters.solution }}
        arguments: '--configuration ${{ parameters.buildConfiguration }} --no-restore'

    - ${{ if eq(parameters.enableTests, true) }}:
      - task: CmdLine@2
        displayName: Pre-pull SQL Server image for Testcontainers
        inputs:
          script: |
            docker pull ${{ parameters.mssqlImage }}

      - task: DotNetCoreCLI@2
        displayName: Run tests with coverage
        continueOnError: true
        inputs:
          command: test
          projects: ${{ parameters.testProjects }}
          publishTestResults: false
          arguments: >-
            --no-restore
            --logger trx
            --results-directory $(Agent.TempDirectory)
            --configuration ${{ parameters.buildConfiguration }}
            --collect "XPlat Code Coverage"
            --settings ${{ parameters.testRunSettingsPath }}
            --logger "console;verbosity=detailed"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - task: PublishTestResults@2
        displayName: Publish test results
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: '$(Agent.TempDirectory)/**/*.trx'

    - ${{ if eq(parameters.enableSonarQube, true) }}:
      - task: SonarQubeAnalyze@8
        displayName: SonarQube Analyze

      - task: SonarQubePublish@8
        displayName: SonarQube Publish Quality Gate
        inputs:
          pollingTimeoutSec: '300'

    - task: CmdLine@2
      displayName: Pre-Docker Disk Cleanup
      condition: always()
      inputs:
        script: |
          df -h
          find . -type d -name 'bin' -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name 'obj' -exec rm -rf {} + 2>/dev/null || true
          rm -rf ~/.sonar/cache 2>/dev/null || true
          dotnet nuget locals all --clear 2>/dev/null || true
          docker system prune -af || true
          docker builder prune -af || true
          df -h

  # ============================================================
  # JOB 2 (matrix): each leg builds + Trivy-scans + pushes one
  # image. Legs are generated from the `images` parameter and run
  # in parallel on separate agents.
  # ============================================================
  - job: BuildImages
    displayName: Build, Scan & Push Images
    dependsOn: BuildSolution
    timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
    cancelTimeoutInMinutes: 5
    strategy:
      matrix:
        ${{ each image in parameters.images }}:
          ${{ image.name }}:
            buildName: ${{ image.name }}
            imageLabel: ${{ image.label }}
            ddEngagementName: ${{ image.ddEngagementName }}
            ddTestTitle: ${{ image.ddTestTitle }}
            dockerfilePath: ${{ image.dockerfilePath }}
            imageTag: ${{ image.imageTag }}
      maxParallel: ${{ length(parameters.images) }}
    steps:

    - task: Docker@2
      displayName: Docker Login
      inputs:
        command: login
        containerRegistry: ${{ parameters.dockerRegistryServiceConnection }}

    - ${{ if eq(parameters.enableNuGetAuthenticate, true) }}:
      - task: NuGetAuthenticate@1
        displayName: Authenticate NuGet feeds (Docker restore)
        ${{ if not(eq(parameters.nugetServiceConnection, '')) }}:
          inputs:
            nuGetServiceConnections: ${{ parameters.nugetServiceConnection }}

    # ============================================================
    # 🔒 INSTALL TRIVY
    # ---- FIX: apt-key is deprecated/unreliable on newer Ubuntu images
    # (ubuntu-latest has moved to 24.04 "Noble"), which was silently leaving
    # Trivy uninstalled. Use Aqua's official install script instead, and
    # verify the binary actually works before moving on so a broken install
    # fails loudly here instead of surfacing later as "command not found".
    # ============================================================
    - ${{ if eq(parameters.enableTrivy, true) }}:
      - task: CmdLine@2
        displayName: Install Trivy
        inputs:
          script: |
            set -e
            sudo apt-get update -qq
            sudo apt-get install -y ca-certificates curl gnupg
            curl -fsSL https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list
            sudo apt-get update -qq
            sudo apt-get install -y trivy
            if ! command -v trivy >/dev/null 2>&1; then
              echo "##vso[task.logissue type=error]Trivy binary not found on PATH after install."
              exit 1
            fi
            trivy --version

      - task: CmdLine@2
        displayName: Download Trivy HTML template
        inputs:
          script: |
            mkdir -p $(Pipeline.Workspace)/trivy-templates
            curl -sL -o $(Pipeline.Workspace)/trivy-templates/html.tpl \
              https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

    # ============================================================
    # BUILD → SCAN (Trivy) → PUSH → CLEANUP (matrix leg)
    # ============================================================
    - task: CmdLine@2
      displayName: Build $(imageLabel) image
      env:
        FEED_ACCESSTOKEN: $(VSS_NUGET_ACCESSTOKEN)
      inputs:
        script: |
          docker build --no-cache \
            -t ${{ parameters.dockerRepository }}:$(imageTag) \
            -f $(dockerfilePath) \
            --build-arg FEED_ACCESSTOKEN="$FEED_ACCESSTOKEN" \
            --build-arg FEED_URL=${{ parameters.nugetFeedUrl }} \
            --build-arg FEED_USERNAME=${{ parameters.nugetFeedUsername }} \
            ${{ parameters.dockerBuildContext }}

    - ${{ if eq(parameters.enableTrivy, true) }}:
      - task: CmdLine@2
        displayName: Prepare Trivy $(imageLabel) report directory
        inputs:
          script: |
            mkdir -p $(System.DefaultWorkingDirectory)/trivy-$(buildName)-report
            chmod 777 $(System.DefaultWorkingDirectory)/trivy-$(buildName)-report

      - task: CmdLine@2
        displayName: Scan $(imageLabel) image (Trivy)
        inputs:
          script: |
            export TRIVY_CACHE_DIR=$(Pipeline.Workspace)/trivy-$(buildName)
            mkdir -p $TRIVY_CACHE_DIR

            echo "Scanning $(imageLabel) image (console)..."
            trivy image \
              --scanners vuln \
              --cache-dir $TRIVY_CACHE_DIR \
              --no-progress \
              --timeout 10m \
              --exit-code 0 \
              --severity ${{ parameters.trivySeverity }} \
              ${{ parameters.dockerRepository }}:$(imageTag)

            echo "Generating Trivy $(imageLabel) HTML report..."
            trivy image \
              --scanners vuln \
              --cache-dir $TRIVY_CACHE_DIR \
              --no-progress \
              --timeout 10m \
              --exit-code 0 \
              --severity ${{ parameters.trivySeverity }} \
              --format template \
              --template "@$(Pipeline.Workspace)/trivy-templates/html.tpl" \
              -o $(System.DefaultWorkingDirectory)/trivy-$(buildName)-report/trivy-$(buildName).html \
              ${{ parameters.dockerRepository }}:$(imageTag)

            echo "Generating Trivy $(imageLabel) JSON report (for DefectDojo)..."
            trivy image \
              --scanners vuln \
              --cache-dir $TRIVY_CACHE_DIR \
              --no-progress \
              --timeout 10m \
              --exit-code 0 \
              --severity ${{ parameters.trivySeverity }} \
              --format json \
              -o $(System.DefaultWorkingDirectory)/trivy-$(buildName)-report/trivy-$(buildName).json \
              ${{ parameters.dockerRepository }}:$(imageTag)

      - task: PublishPipelineArtifact@1
        displayName: Publish Trivy $(imageLabel) Report
        condition: succeededOrFailed()
        inputs:
          targetPath: '$(System.DefaultWorkingDirectory)/trivy-$(buildName)-report'
          artifactName: 'Trivy-$(imageLabel)-Report'

      - task: PublishHtmlReport@1
        displayName: Show Trivy $(imageLabel) Tab
        condition: succeededOrFailed()
        inputs:
          reportDir: '$(System.DefaultWorkingDirectory)/trivy-$(buildName)-report'
          tabName: 'Trivy $(imageLabel)'

      - task: CmdLine@2
        displayName: Push Trivy $(imageLabel) results to DefectDojo
        condition: succeededOrFailed()
        inputs:
          script: |
            HTTP_CODE=$(curl -sS -o /tmp/dd_trivy_$(buildName)_response.json -w "%{http_code}" -X POST "$DEFECTDOJO_URL/api/v2/reimport-scan/" \
              -H "Authorization: Token $DEFECTDOJO_API_KEY" \
              -F "scan_type=Trivy Scan" \
              -F "file=@$(System.DefaultWorkingDirectory)/trivy-$(buildName)-report/trivy-$(buildName).json" \
              -F "product_type_name=${{ parameters.productTypeName }}" \
              -F "product_name=${{ parameters.productName }}" \
              -F "engagement_name=$(ddEngagementName)" \
              -F "test_title=$(ddTestTitle)" \
              -F "auto_create_context=True" \
              -F "close_old_findings=true" \
              -F "minimum_severity=${{ parameters.defectDojoMinSeverity }}")
            echo "DefectDojo response (HTTP $HTTP_CODE):"
            cat /tmp/dd_trivy_$(buildName)_response.json
            echo ""
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "##vso[task.logissue type=error]DefectDojo import (Trivy $(imageLabel)) failed with HTTP $HTTP_CODE"
              exit 1
            fi
        env:
          DEFECTDOJO_URL: ${{ parameters.defectDojoUrl }}
          DEFECTDOJO_API_KEY: ${{ parameters.defectDojoApiKey }}

    - ${{ if eq(parameters.enableDockerPush, true) }}:
      - task: CmdLine@2
        displayName: Push $(imageLabel) image
        inputs:
          script: |
            docker push ${{ parameters.dockerRepository }}:$(imageTag)

    - task: CmdLine@2
      displayName: Cleanup after $(imageLabel) build
      condition: always()
      inputs:
        script: |
          docker system prune -af || true
          docker builder prune -af || true
          df -h

