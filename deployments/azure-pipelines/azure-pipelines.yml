# ============================================================
# SilkRoad CI/CD Pipeline - BLUE/GREEN + SECURITY + SONARQUBE
# ============================================================
# Stages: Governance Gate -> Build (+Trivy) -> ZAP Baseline ->
# ZAP AJAX -> Blue/Green Deploy
# ------------------------------------------------------------
# This file extends pipeline-governance/templates/secure-pipeline-extends.yml
# (@repo root). The governance extends template emits a mandatory
# stage, MandatoryGovernanceCheck, that runs FIRST and validates that
# the required governance inputs (SonarQube project key/name and the
# DefectDojo URL) are set before any project stage executes. On failure
# it blocks the pipeline; on success the consumer stages below are
# injected unchanged. Stage chaining makes every stage implicitly
# depend on the governance gate.
#
# All stage logic lives in the reusable templates under
# deployments/azure-pipelines/templates/:
#   templates/build.yml              (Build/SonarQube/OWASP/Trivy/push)
#   templates/dast.yml              (ZAP Baseline + AJAX Spider)
#   templates/blue-green-deploy.yml (Blue/Green deploy)
# ============================================================

# ============================================================
# Runtime parameters (override when running the pipeline)
# ============================================================
parameters:
- name: healthCheckUrl
  displayName: Post-deployment health check URL
  type: string
  default: 'https://silkroad.aion-time.com/health'

resources:
  repositories:
  - repository: templates
    type: git
    name: CentralHub/CentralHub
    ref: refs/heads/master

variables:
- group: silkroad-prod
- name: dockerRepository
  value: 'tunnetcom/silkroad'
- name: apiTag
  value: 'api-$(Build.BuildId)'
- name: webappTag
  value: 'webapp-$(Build.BuildId)'
- name: kubeNamespace
  value: 'silkroad-dev'
- name: apiService
  value: 'silkroad-api-service'
- name: webService
  value: 'silkroad-webapp-service'
- name: zapTarget
  value: 'https://silkroad.aion-time.com'
- name: defectDojoUrl
  value: 'https://defectdojo.aion-time.com'

extends:
  template: pipeline-governance/templates/secure-pipeline-extends.yml@templates
  parameters:
    sonarProjectKey: 'Silk_Road_ERP_Silk_Road_ERP_5cfe75f5-a231-4074-9e4c-4f5ccd21b96e'
    sonarProjectName: 'SilkRoad ERP'
    defectDojoUrl: $(DefectDojoUrl)
    stages:

    # ============================================================
    # 1️⃣  BUILD
    # ============================================================
    - template: templates/build.yml@templates
      parameters:
        dockerRegistryServiceConnection: 'TunNetCom_Dockerhub_Connection'
        dockerRepository: $(dockerRepository)
        enableSonarQube: false
        enableNuGetAuthenticate: true
        nugetConfigPath: 'nuget.config'
        nugetFeedUrl: 'https://pkgs.dev.azure.com/TunNetCom/Silk_Road_ERP/_packaging/SilkRoadFeed/nuget/v3/index.json'
        nugetFeedUsername: 'docker'
        images:
        - name: api
          label: API
          dockerfilePath: 'src/Modules/Sales/TunNetCom.SilkRoadErp.Sales.Api/Dockerfile'
          imageTag: $(apiTag)
          ddEngagementName: 'SilkRoad API'
          ddTestTitle: 'Trivy - API Image'
        - name: web
          label: Web
          dockerfilePath: 'src/Modules/Sales/TunNetCom.SilkRoadErp.Sales.WebApp/Dockerfile'
          imageTag: $(webappTag)
          ddEngagementName: 'SilkRoad WebApp'
          ddTestTitle: 'Trivy - Web Image'
        testProjects: |
          test/TunNetCom.SilkRoadErp.Infrastructure.MultiTenancy.Tests/TunNetCom.SilkRoadErp.Infrastructure.MultiTenancy.Tests.csproj
          test/Modules/Sales/TunNetCom.SilkRoadErp.Sales.UnitTests/TunNetCom.SilkRoadErp.Sales.UnitTests.csproj
        sonarProjectKey: 'Silk_Road_ERP_Silk_Road_ERP_5cfe75f5-a231-4074-9e4c-4f5ccd21b96e'
        sonarProjectName: 'SilkRoad ERP'
        sonarHostUrl: 'https://sonarqube.aion-time.com'
        sonarCoverageExclusions: '**/*.razor,**/*.razor.cs,**/*.cshtml,src/Administration/TunNetCom.SilkRoadErp.Administration.HttpClients/**,src/Modules/Sales/TunNetCom.SilkRoadErp.Sales.HttpClients/**,src/Aspire/TunNetCom.SilkRoadErp.AppHost/**'
        nvdApiKey: $(nvdApiKey)
        defectDojoUrl: $(defectDojoUrl)
        defectDojoApiKey: $(defectDojoApiKey)

    # ============================================================
    # 2️⃣  ZAP BASELINE + 3️⃣ ZAP AJAX
    # ============================================================
    - template: templates/dast.yml@templates
      parameters:
        zapTarget: $(zapTarget)
        defectDojoUrl: $(defectDojoUrl)
        defectDojoApiKey: $(defectDojoApiKey)

    # ============================================================
    # 4️⃣  DEPLOY TO DEV (Blue/Green)
    # ============================================================
    - template: templates/blue-green-deploy.yml@templates
      parameters:
        environmentName: silkroad-dev
        kubeNamespace: $(kubeNamespace)
        apiService: $(apiService)
        webService: $(webService)
        dockerRepository: $(dockerRepository)
        apiTag: $(apiTag)
        webappTag: $(webappTag)
        healthCheckUrl: ${{ parameters.healthCheckUrl }}
