# ============================================================
# SilkRoad CI/CD Pipeline - BLUE/GREEN + SECURITY + SONARQUBE
# ============================================================
# Stages: Build (+Trivy) -> ZAP Baseline -> ZAP AJAX -> Ensure
# Worker VM -> Blue/Green Deploy
# ------------------------------------------------------------
# This file is a thin orchestrator. All stage logic lives in the
# reusable templates under deployments/azure-pipelines/templates/:
#   templates/build.yml              (Build/SonarQube/OWASP/Trivy/push)
#   templates/dast.yml               (ZAP Baseline + AJAX Spider)
#   templates/ensure-worker.yml      (Terraform worker VM IaC)
#   templates/blue-green-deploy.yml  (Blue/Green deploy)
# Stages run in the order they appear below (default dependsOn).
# ============================================================

variables:
- group: silkroad-prod
- name: dockerRepository
  value: 'tunnetcom/silkroad'
- name: apiTag
  value: 'api-$(Build.BuildId)'
- name: webappTag
  value: 'webapp-$(Build.BuildId)'
- name: kubeNamespace
  value: 'silkroad-dev'
- name: apiService
  value: 'silkroad-api-service'
- name: webService
  value: 'silkroad-webapp-service'
- name: zapTarget
  value: 'https://silkroad.aion-time.com'
- name: defectDojoUrl
  value: 'https://defectdojo.aion-time.com'

stages:

# ============================================================
# 1️⃣  BUILD
# ============================================================
- template: templates/build.yml
  parameters:
    dockerRegistryServiceConnection: 'TunNetCom_Dockerhub_Connection'
    dockerRepository: $(dockerRepository)
    apiDockerfilePath: 'src/Modules/Sales/TunNetCom.SilkRoadErp.Sales.Api/Dockerfile'
    webappDockerfilePath: 'src/Modules/Sales/TunNetCom.SilkRoadErp.Sales.WebApp/Dockerfile'
    apiTag: $(apiTag)
    webappTag: $(webappTag)
    sonarProjectKey: 'Silk_Road_ERP_Silk_Road_ERP_5cfe75f5-a231-4074-9e4c-4f5ccd21b96e'
    sonarProjectName: 'SilkRoad ERP'
    sonarHostUrl: 'https://sonarqube.aion-time.com'
    nvdApiKey: $(nvdApiKey)
    defectDojoUrl: $(defectDojoUrl)
    defectDojoApiKey: $(defectDojoApiKey)

# ============================================================
# 2️⃣  ZAP BASELINE + 3️⃣ ZAP AJAX
# ============================================================
- template: templates/dast.yml
  parameters:
    zapTarget: $(zapTarget)
    defectDojoUrl: $(defectDojoUrl)
    defectDojoApiKey: $(defectDojoApiKey)

# ============================================================
# 4️⃣  ENSURE WORKER VM EXISTS (IaC)
# ============================================================
- template: templates/ensure-worker.yml
  parameters:
    azureSubscription: 'TunNetCom_Azure_Connection'
    sshKey: $(AZURE_WORKER_SSH_KEY)

# ============================================================
# 5️⃣  DEPLOY TO DEV (Blue/Green)
# ============================================================
- template: templates/blue-green-deploy.yml
  parameters:
    environmentName: silkroad-dev
    kubeNamespace: $(kubeNamespace)
    apiService: $(apiService)
    webService: $(webService)
    dockerRepository: $(dockerRepository)
    apiTag: $(apiTag)
    webappTag: $(webappTag)
